<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prism Chords</title>
<style>
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:0;overflow:hidden;touch-action:none;
  background:radial-gradient(ellipse at 15% 0%,#1a1033 0%,transparent 55%),radial-gradient(ellipse at 85% 100%,#0a2a3a 0%,transparent 55%),radial-gradient(ellipse at 50% 50%,#101a2e 0%,#060a12 70%);
  color:#e6fbff;}
#app{display:flex;height:100dvh;}
#gridWrap{flex:1;display:flex;flex-direction:column;padding:12px;min-width:0;}
#topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
h1{font-size:22px;margin:0;letter-spacing:3px;font-weight:800;
  background:linear-gradient(135deg,#facc15,#f472b6,#00f0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(244,114,182,.4));}
select{background:#0e2233;color:#e6fbff;border:1px solid rgba(0,240,255,.4);border-radius:8px;padding:8px;font-size:14px;}
#grid{flex:1;display:grid;gap:8px;min-height:0;}
.cell{border-radius:12px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .15s;min-height:0;overflow:hidden;}
.cell .cn{font-size:20px;font-weight:800;letter-spacing:1px;}
.cell .ct{font-size:11px;font-weight:600;opacity:.85;letter-spacing:.5px;}
.cell .notes{font-size:9px;opacity:.6;margin-top:2px;letter-spacing:.3px;}
.cell:active{transform:scale(.96);}
/* Row colors */
.cell.r0{border-color:rgba(250,204,21,.5);background:linear-gradient(135deg,rgba(250,204,21,.14),rgba(250,204,21,.03));}
.cell.r0 .cn{color:#fde68a;} .cell.r0 .ct{color:#facc15;}
.cell.r0.active{background:rgba(250,204,21,.3);box-shadow:0 0 22px rgba(250,204,21,.5);border-color:#facc15;}
.cell.r1{border-color:rgba(0,240,255,.5);background:linear-gradient(135deg,rgba(0,240,255,.14),rgba(0,240,255,.03));}
.cell.r1 .cn{color:#a5f3fc;} .cell.r1 .ct{color:#00f0ff;}
.cell.r1.active{background:rgba(0,240,255,.3);box-shadow:0 0 22px rgba(0,240,255,.5);border-color:#00f0ff;}
.cell.r2{border-color:rgba(192,132,252,.5);background:linear-gradient(135deg,rgba(192,132,252,.14),rgba(192,132,252,.03));}
.cell.r2 .cn{color:#ddd6fe;} .cell.r2 .ct{color:#c084fc;}
.cell.r2.active{background:rgba(192,132,252,.3);box-shadow:0 0 22px rgba(192,132,252,.5);border-color:#c084fc;}
.cell.r3{border-color:rgba(46,230,168,.5);background:linear-gradient(135deg,rgba(46,230,168,.14),rgba(46,230,168,.03));}
.cell.r3 .cn{color:#a7f3d0;} .cell.r3 .ct{color:#2ee6a8;}
.cell.r3.active{background:rgba(46,230,168,.3);box-shadow:0 0 22px rgba(46,230,168,.5);border-color:#2ee6a8;}
#ribbon{width:72px;background:linear-gradient(to bottom,#1a1033,#0a2a3a,#06121c);border-left:1px solid rgba(244,114,182,.25);position:relative;touch-action:none;cursor:ns-resize;}
#ribbonFill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#f472b6,#c084fc,#00f0ff);opacity:.5;pointer-events:none;}
#ribbonLabel{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:#f9a8d4;letter-spacing:2px;font-weight:700;pointer-events:none;}
#hint{text-align:center;font-size:12px;color:#9fd8e2;opacity:.7;padding:8px;}
</style>
</head>
<body>
<div id="app">
<div id="gridWrap">
<div id="topbar">
<h1>PRISM</h1>
<select id="keySel"></select>
<select id="soundSel">
<option value="lush">Lush Pad</option>
<option value="glass">Glass</option>
<option value="warm">Warm Analog</option>
</select>
</div>
<div id="grid"></div>
<div id="hint">Tap a chord. Slide across for progressions. Two fingers welcome. Right strip = filter.</div>
</div>
<div id="ribbon"><div id="ribbonLabel">FILTER</div><div id="ribbonFill"></div></div>
</div>
<script>
// ---------- No-zoom lock (two-finger play) ----------
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<300)e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
// ---------- Audio ----------
let ctx=null, master=null, filterNode=null;
function ensureAudio(){
  if(ctx) { if(ctx.state==='suspended') ctx.resume(); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=0.8;
  filterNode=ctx.createBiquadFilter(); filterNode.type='lowpass'; filterNode.frequency.value=4000; filterNode.Q.value=0.7;
  const comp=ctx.createDynamicsCompressor();
  const len=Math.floor(ctx.sampleRate*1.8), imp=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
  const rev=ctx.createConvolver(); rev.buffer=imp;
  const wet=ctx.createGain(); wet.gain.value=0.35;
  filterNode.connect(master); master.connect(comp);
  filterNode.connect(rev); rev.connect(wet); wet.connect(comp);
  comp.connect(ctx.destination);
}
// ---------- Chord theory (9th max) ----------
const VOICINGS={
  'maj9':[0,4,7,11,14],    // 1, 3, 5, 7, 9
  'min9':[0,3,7,10,14],    // 1, b3, 5, b7, 9
  'dom9':[0,4,7,10,14],    // 1, 3, 5, b7, 9
  '69':[0,4,7,9,14],       // 1, 3, 5, 6, 9
};
const VOICING_LABELS={'maj9':'maj9','min9':'m9','dom9':'9','69':'6/9'};
const KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEY_OFFSET={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
const DEGREE_OFFSETS=[0,2,4,5,7,9,11,12];
const ROW_VOICINGS=['maj9','min9','dom9','69'];

function chordFreqs(rootMidi, voicing){
  return VOICINGS[voicing].map(semi=>{
    const midi=rootMidi+semi;
    return 440*Math.pow(2,(midi-69)/12);
  });
}
function chordNoteNames(rootMidi, voicing){
  return VOICINGS[voicing].map(semi=>KEYS[(rootMidi+semi)%12]);
}
// ---------- Pad synthesis ----------
let activeVoices=[];
function playChord(freqs){
  ensureAudio();
  stopChord(0.15);
  const t=ctx.currentTime, sound=document.getElementById('soundSel').value;
  freqs.forEach(f=>{
    [-4,4].forEach(cents=>{
      const o=ctx.createOscillator();
      o.type = sound==='glass' ? 'sine' : 'sawtooth';
      o.frequency.value=f; o.detune.value=cents+(Math.random()*6-3);
      const fl=ctx.createBiquadFilter(); fl.type='lowpass';
      fl.frequency.value = sound==='warm' ? 1200 : 2500;
      const g=ctx.createGain();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.12,t+0.4);
      g.gain.setValueAtTime(0.12,t+1.5);
      o.connect(fl); fl.connect(g); g.connect(filterNode);
      o.start(t); o.stop(t+3);
      activeVoices.push({o,g});
    });
  });
}
function stopChord(release){
  if(!ctx) return; const t=ctx.currentTime;
  activeVoices.forEach(v=>{
    try{
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(v.g.gain.value,t);
      v.g.gain.linearRampToValueAtTime(0.001,t+release);
      v.o.stop(t+release+0.1);
    }catch(e){}
  });
  activeVoices=[];
}
// ---------- Grid ----------
const grid=document.getElementById('grid');
const keySel=document.getElementById('keySel');
KEYS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k+' major';keySel.appendChild(o);});
keySel.value='C';

function buildGrid(){
  grid.innerHTML='';
  grid.style.gridTemplateColumns='repeat(8,1fr)';
  grid.style.gridTemplateRows='repeat(4,1fr)';
  const keyOffset=KEY_OFFSET[keySel.value];
  for(let r=0;r<4;r++){
    for(let c=0;c<8;c++){
      const cell=document.createElement('div');
      cell.className='cell r'+r;
      const rootMidi=48+keyOffset+DEGREE_OFFSETS[c];
      const voicing=ROW_VOICINGS[r];
      const rootName=KEYS[(keyOffset+DEGREE_OFFSETS[c])%12];
      const notes=chordNoteNames(rootMidi,voicing).join(' ');
      cell.innerHTML='<div class="cn">'+rootName+'</div><div class="ct">'+VOICING_LABELS[voicing]+'</div><div class="notes">'+notes+'</div>';
      const trigger=()=>{
        document.querySelectorAll('.cell.active').forEach(x=>x.classList.remove('active'));
        cell.classList.add('active');
        playChord(chordFreqs(rootMidi,voicing));
      };
      cell.addEventListener('pointerdown',e=>{e.preventDefault();trigger();});
      cell.addEventListener('pointerenter',e=>{if(e.buttons||e.pressure>0)trigger();});
      grid.appendChild(cell);
    }
  }
}
keySel.onchange=buildGrid;
buildGrid();
document.addEventListener('pointerup',()=>{
  setTimeout(()=>document.querySelectorAll('.cell.active').forEach(x=>x.classList.remove('active')),300);
});
// ---------- Filter ribbon ----------
const ribbon=document.getElementById('ribbon'), ribbonFill=document.getElementById('ribbonFill');
function setFilter(y){
  ensureAudio();
  const rect=ribbon.getBoundingClientRect();
  const norm=Math.max(0,Math.min(1,1-(y-rect.top)/rect.height));
  const freq=200*Math.pow(9000/200,norm);
  filterNode.frequency.setTargetAtTime(freq,ctx.currentTime,0.03);
  ribbonFill.style.height=(norm*100)+'%';
}
ribbon.addEventListener('pointerdown',e=>{e.preventDefault();setFilter(e.clientY);
  const mv=ev=>setFilter(ev.clientY);
  const up=()=>{ribbon.removeEventListener('pointermove',mv);ribbon.removeEventListener('pointerup',up);};
  ribbon.addEventListener('pointermove',mv); ribbon.addEventListener('pointerup',up);
});
setTimeout(()=>{const r=ribbon.getBoundingClientRect();setFilter(r.top+r.height*0.3);},500);
</script>
</body>
</html>
