<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prism Chords</title>
<style>
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:0;overflow:hidden;touch-action:none;color:#fff;
  background:#0a0618;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 10% 10%,rgba(244,114,182,.28),transparent),
    radial-gradient(ellipse 50% 45% at 90% 15%,rgba(0,240,255,.22),transparent),
    radial-gradient(ellipse 55% 40% at 50% 90%,rgba(192,132,252,.25),transparent),
    radial-gradient(ellipse 40% 35% at 85% 75%,rgba(250,204,21,.16),transparent),
    radial-gradient(ellipse 45% 40% at 15% 85%,rgba(46,230,168,.18),transparent);
  animation:aurora 14s ease-in-out infinite alternate;}
@keyframes aurora{from{transform:scale(1) rotate(0deg);opacity:.9;}to{transform:scale(1.12) rotate(2deg);opacity:1;}}
#app{display:flex;height:100dvh;position:relative;z-index:1;}
#gridWrap{flex:1;display:flex;flex-direction:column;padding:12px;padding-bottom:34px;padding-bottom:max(34px, calc(12px + env(safe-area-inset-bottom)));min-width:0;}
#topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
h1{font-size:24px;margin:0;letter-spacing:4px;font-weight:900;
  background:linear-gradient(90deg,#facc15,#fb7185,#c084fc,#00f0ff,#2ee6a8);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(244,114,182,.5));}
select{background:rgba(14,34,51,.9);color:#fff;border:1px solid rgba(0,240,255,.5);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;}
#clusterBtn{background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#e9d5ff;border:2px solid rgba(192,132,252,.6);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;}
#clusterBtn.on{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-color:#f0abfc;box-shadow:0 0 18px rgba(192,132,252,.6);}
#grid{flex:1;display:grid;gap:8px;min-height:0;}
.cell{border-radius:14px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .15s,filter .15s;min-height:0;overflow:hidden;position:relative;}
.cell .cn{font-size:22px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.cell .ct{font-size:12px;font-weight:700;opacity:.9;letter-spacing:1px;}
.cell .notes{font-size:9px;opacity:.65;margin-top:3px;letter-spacing:.3px;font-weight:600;}
.cell:active{transform:scale(.94);}
.cell.active{filter:brightness(1.35) saturate(1.3);}
/* Row colors — bold */
.cell.r0{border-color:#facc15;background:linear-gradient(135deg,rgba(250,204,21,.35),rgba(249,115,22,.18));box-shadow:inset 0 0 20px rgba(250,204,21,.12);}
.cell.r0 .cn{color:#fef08a;} .cell.r0 .ct{color:#fde047;}
.cell.r0.active{background:linear-gradient(135deg,rgba(250,204,21,.6),rgba(249,115,22,.35));box-shadow:0 0 28px rgba(250,204,21,.8);border-color:#fef08a;}
.cell.r1{border-color:#00f0ff;background:linear-gradient(135deg,rgba(0,240,255,.32),rgba(59,130,246,.16));box-shadow:inset 0 0 20px rgba(0,240,255,.12);}
.cell.r1 .cn{color:#cffafe;} .cell.r1 .ct{color:#67e8f9;}
.cell.r1.active{background:linear-gradient(135deg,rgba(0,240,255,.55),rgba(59,130,246,.3));box-shadow:0 0 28px rgba(0,240,255,.8);border-color:#cffafe;}
.cell.r2{border-color:#c084fc;background:linear-gradient(135deg,rgba(192,132,252,.35),rgba(236,72,153,.16));box-shadow:inset 0 0 20px rgba(192,132,252,.12);}
.cell.r2 .cn{color:#f3e8ff;} .cell.r2 .ct{color:#d8b4fe;}
.cell.r2.active{background:linear-gradient(135deg,rgba(192,132,252,.6),rgba(236,72,153,.35));box-shadow:0 0 28px rgba(192,132,252,.8);border-color:#f3e8ff;}
.cell.r3{border-color:#2ee6a8;background:linear-gradient(135deg,rgba(46,230,168,.32),rgba(20,184,166,.16));box-shadow:inset 0 0 20px rgba(46,230,168,.12);}
.cell.r3 .cn{color:#d1fae5;} .cell.r3 .ct{color:#6ee7b7;}
.cell.r3.active{background:linear-gradient(135deg,rgba(46,230,168,.55),rgba(20,184,166,.3));box-shadow:0 0 28px rgba(46,230,168,.8);border-color:#d1fae5;}
/* Column hue shimmer */
.cell.c0{filter:hue-rotate(-8deg);} .cell.c7{filter:hue-rotate(8deg);}
#ribbon{width:76px;background:linear-gradient(to bottom,#2e1065,#0c4a6e,#064e3b);border-left:2px solid rgba(244,114,182,.4);position:relative;touch-action:none;cursor:ns-resize;}
#ribbonFill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#fb7185,#c084fc,#00f0ff,#2ee6a8);opacity:.65;pointer-events:none;}
#ribbonLabel{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;color:#fff;letter-spacing:2px;font-weight:800;text-shadow:0 0 8px rgba(244,114,182,.8);pointer-events:none;}
#hint{text-align:center;font-size:12px;color:#e9d5ff;opacity:.75;padding:8px;font-weight:600;}
</style>
</head>
<body>
<div id="app">
<div id="gridWrap">
<div id="topbar">
<h1>PRISM</h1>
<select id="keySel"></select>
<select id="soundSel">
<option value="lush">Lush Pad</option>
<option value="glass">Glass</option>
<option value="warm">Warm Analog</option>
</select>
<button id="clusterBtn">Cluster: OFF</button>
</div>
<div id="grid"></div>
<div id="hint">Tap a chord. Slide for progressions. Cluster fires neighbors too. Right strip = filter.</div>
</div>
<div id="ribbon"><div id="ribbonLabel">FILTER</div><div id="ribbonFill"></div></div>
</div>
<script>
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('gestureend',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<300)e.preventDefault();lastTouchEnd=now;},{passive:false});
let ctx=null, master=null, filterNode=null;
function ensureAudio(){
  if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=0.8;
  filterNode=ctx.createBiquadFilter();filterNode.type='lowpass';filterNode.frequency.value=4000;filterNode.Q.value=0.7;
  const comp=ctx.createDynamicsCompressor();
  const len=Math.floor(ctx.sampleRate*1.8),imp=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
  const rev=ctx.createConvolver();rev.buffer=imp;
  const wet=ctx.createGain();wet.gain.value=0.35;
  filterNode.connect(master);master.connect(comp);
  filterNode.connect(rev);rev.connect(wet);wet.connect(comp);
  comp.connect(ctx.destination);
}
const VOICINGS={'maj':[0,4,7],'min':[0,3,7],'sus':[0,5,7],'5':[0,7],};
const VOICING_LABELS={'maj':'maj','min':'min','sus':'sus','5':'5'};
const KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEY_OFFSET={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
const DEGREE_OFFSETS=[0,2,4,5,7,9,11,12];
const ROW_VOICINGS=['maj','min','sus','5'];
function chordFreqs(rootMidi,voicing){return VOICINGS[voicing].map(semi=>440*Math.pow(2,(rootMidi+semi-69)/12));}
function chordNoteNames(rootMidi,voicing){return VOICINGS[voicing].map(semi=>KEYS[(rootMidi+semi)%12]);}
let activeVoices=[];
let clusterMode=false;
function playChordSet(chordList){
  ensureAudio();stopChord(0.15);
  const t=ctx.currentTime,sound=document.getElementById('soundSel').value;
  // In cluster mode, use single osc per note to keep voice count sane
  const layers=chordList.length>1?[0]:[-4,4];
  chordList.forEach(freqs=>{
    freqs.forEach(f=>{
      layers.forEach(cents=>{
        const o=ctx.createOscillator();
        o.type=sound==='glass'?'sine':'sawtooth';
        o.frequency.value=f;o.detune.value=cents+(Math.random()*6-3);
        const fl=ctx.createBiquadFilter();fl.type='lowpass';
        fl.frequency.value=sound==='warm'?1200:2500;
        const g=ctx.createGain();
        const peak=chordList.length>1?0.07:0.12; // softer per-note in cluster
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(peak,t+0.4);
        g.gain.setValueAtTime(peak,t+1.5);
        o.connect(fl);fl.connect(g);g.connect(filterNode);
        o.start(t);o.stop(t+3);
        activeVoices.push({o,g});
      });
    });
  });
}
function stopChord(release){
  if(!ctx)return;const t=ctx.currentTime;
  activeVoices.forEach(v=>{try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.linearRampToValueAtTime(0.001,t+release);v.o.stop(t+release+0.1);}catch(e){}});
  activeVoices=[];
}
const grid=document.getElementById('grid');
const keySel=document.getElementById('keySel');
KEYS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k+' major';keySel.appendChild(o);});
keySel.value='C';
let cellGrid=[]; // 4x8 array of {cell, rootMidi, voicing}
document.getElementById('clusterBtn').onclick=e=>{
  clusterMode=!clusterMode;
  e.target.textContent='Cluster: '+(clusterMode?'ON':'OFF');
  e.target.classList.toggle('on',clusterMode);
};
function buildGrid(){
  grid.innerHTML='';cellGrid=[];
  grid.style.gridTemplateColumns='repeat(8,1fr)';
  grid.style.gridTemplateRows='repeat(4,1fr)';
  const keyOffset=KEY_OFFSET[keySel.value];
  for(let r=0;r<4;r++){
    cellGrid[r]=[];
    for(let c=0;c<8;c++){
      const cell=document.createElement('div');
      cell.className='cell r'+r+' c'+c;
      const rootMidi=48+keyOffset+DEGREE_OFFSETS[c];
      const voicing=ROW_VOICINGS[r];
      const rootName=KEYS[(keyOffset+DEGREE_OFFSETS[c])%12];
      const notes=chordNoteNames(rootMidi,voicing).join(' ');
      cell.innerHTML='<div class="cn">'+rootName+'</div><div class="ct">'+VOICING_LABELS[voicing]+'</div><div class="notes">'+notes+'</div>';
      cellGrid[r][c]={cell,rootMidi,voicing};
      const trigger=()=>{
        document.querySelectorAll('.cell.active').forEach(x=>x.classList.remove('active'));
        if(clusterMode){
          // Fire tapped + 4 orthogonal neighbors
          const targets=[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&rr<4&&cc>=0&&cc<8);
          const chordList=targets.map(([rr,cc])=>{
            const t=cellGrid[rr][cc];
            t.cell.classList.add('active');
            return chordFreqs(t.rootMidi,t.voicing);
          });
          playChordSet(chordList);
        }else{
          cell.classList.add('active');
          playChordSet([chordFreqs(rootMidi,voicing)]);
        }
      };
      cell.addEventListener('pointerdown',e=>{e.preventDefault();trigger();});
      cell.addEventListener('pointerenter',e=>{if(e.buttons||e.pressure>0)trigger();});
      grid.appendChild(cell);
    }
  }
}
keySel.onchange=buildGrid;
buildGrid();
document.addEventListener('pointerup',()=>{setTimeout(()=>document.querySelectorAll('.cell.active').forEach(x=>x.classList.remove('active')),400);});
const ribbon=document.getElementById('ribbon'),ribbonFill=document.getElementById('ribbonFill');
function setFilter(y){
  ensureAudio();
  const rect=ribbon.getBoundingClientRect();
  const norm=Math.max(0,Math.min(1,1-(y-rect.top)/rect.height));
  filterNode.frequency.setTargetAtTime(200*Math.pow(9000/200,norm),ctx.currentTime,0.03);
  ribbonFill.style.height=(norm*100)+'%';
}
ribbon.addEventListener('pointerdown',e=>{e.preventDefault();setFilter(e.clientY);
  const mv=ev=>setFilter(ev.clientY);
  const up=()=>{ribbon.removeEventListener('pointermove',mv);ribbon.removeEventListener('pointerup',up);};
  ribbon.addEventListener('pointermove',mv);ribbon.addEventListener('pointerup',up);
});
setTimeout(()=>{const r=ribbon.getBoundingClientRect();setFilter(r.top+r.height*0.3);},500);
</script>
</body>
</html>
